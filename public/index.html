<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nib</title>
  <meta name="description" content="A screen reader for paper. Nib reads a form out loud and talks your hand to every blank.">
  <meta name="theme-color" content="#10132F">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" data-screen="start" data-mode="start">
    <header class="bar">
      <div class="brand"><span class="brand-flag" aria-hidden="true"></span><span class="wordmark">Nib</span></div>
      <p class="doc" id="docTitle"></p>
      <div class="steps">
        <span class="count" id="count"></span>
        <ol class="progress" id="progress" aria-label="Places to fill"></ol>
      </div>
    </header>

    <section class="stage" id="stage">
      <video id="video" playsinline muted></video>
      <div class="view">
        <canvas id="canvas" aria-hidden="true"></canvas>
        <figure class="readback" id="readback" hidden>
          <img id="rbImg" alt="">
          <figcaption>
            <span class="rb-label" id="rbLabel"></span>
            <span class="rb-text" id="rbText"></span>
          </figcaption>
        </figure>
      </div>

      <aside class="panel" aria-label="Places to fill">
        <p class="panel-label">What Nib sees</p>
        <h2 class="panel-title" id="panelTitle">No form yet</h2>
        <ol class="fields" id="fieldList"></ol>
        <div class="panel-foot" id="panelFoot" hidden></div>
      </aside>

      <div class="start">
        <button class="start-hit" id="startBtn">Start reading a form</button>
        <div class="start-body">
          <p class="tab" aria-hidden="true">Tap anywhere to start</p>
          <p class="lede">A screen reader for paper. Put the form flat under the camera, and Nib talks your finger to every blank. Hold the screen or the Space key to ask it anything.</p>
          <div class="controls">
            <div class="langs" role="group" aria-label="Language">
              <button data-lang="en">English</button>
              <button data-lang="es" lang="es">Español</button>
              <button data-lang="hi" lang="hi">हिन्दी</button>
              <button data-lang="zh" lang="zh">中文</button>
            </div>
            <label class="cam"><span>Camera</span>
              <select id="camera"><option value="">Default camera</option></select>
            </label>
          </div>
          <p class="status" id="status" role="status"></p>
          <p class="status reader" id="reader"></p>
          <a class="mode-link" id="modeLink" href="?sim">Practice with a sample form</a>
        </div>
      </div>
    </section>

    <footer class="caption">
      <div class="cue" id="cue" aria-hidden="true"><span class="cue-glyph" id="cueGlyph"></span><span class="cue-word" id="cueWord"></span></div>
      <p class="caption-text" id="captionText"></p>
      <div class="buttons">
        <button class="talk" id="talk" aria-pressed="false" aria-label="Ask Nib a question. Hold to talk, or tap to start and tap again to stop.">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
          <span>Ask</span>
        </button>
        <button class="action" id="action">Start</button>
      </div>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
